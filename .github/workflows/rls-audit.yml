name: RLS Cross-Tenant Audit

# Weekly safety net: re-runs tests/rls-audit/audit.sql against staging
# every Monday morning. If any table's status returns FAIL (RLS missing,
# policies missing, or a runtime cross-tenant leak) the script raises
# an exception, psql exits non-zero, and the job goes red.
#
# A red run here is launch-critical: it means a migration shipped that
# broke multi-tenant isolation. Halt deploys until it's green again.
#
# Required repo secret:
#   SUPABASE_STAGING_DB_URL  — full Postgres connection string for the
#                              staging Supabase project
#                              (Project Settings → Database → Connection
#                              string → URI). NEVER set this to a prod URL.

on:
  schedule:
    # Mondays at 07:00 UTC. Early enough that any failure is on
    # someone's screen before the workweek's deploys start.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}      # also runnable on-demand from the Actions tab
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/rls-audit/**'
      - '.github/workflows/rls-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: psql audit.sql against staging
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Refuse to run if staging URL is missing
        env:
          STAGING_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::error::SUPABASE_STAGING_DB_URL secret is not set. Configure it in repo Settings → Secrets → Actions."
            exit 1
          fi
          # Belt-and-braces: never let this hit prod even if someone
          # misconfigures the secret. audit.sql also has its own guard.
          if echo "$STAGING_URL" | grep -iqE '(prod|production)'; then
            echo "::error::Staging URL looks like production. Refusing to continue."
            exit 1
          fi

      - name: Run RLS audit
        env:
          PGPASSWORD_PROMPT: never
          STAGING_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          mkdir -p ./_audit-out
          # -v ON_ERROR_STOP=1 makes psql exit on the first SQL error.
          # The script itself RAISES EXCEPTION on any FAIL row, so this
          # is how the job propagates that to a non-zero exit code.
          #
          # This log is public, so psql writes ONLY to the file (stdout and
          # stderr: the per-table report, the RAISE naming the first failing
          # table, and any libpq connection error). Nothing from it is
          # printed except the step-13 counts, and the file is not uploaded.
          set +e
          psql "$STAGING_URL" \
            -v ON_ERROR_STOP=1 \
            -f tests/rls-audit/audit.sql \
            > ./_audit-out/audit.log 2>&1
          rc=$?
          set -e
          # Step 13 prints one row under the header "fails | warns | oks | total".
          # Print it only when all four cells are integers, so no table row,
          # error text or connection detail can ever reach the log.
          summary=$(awk '
            /^[[:space:]]*fails[[:space:]]*[|][[:space:]]*warns[[:space:]]*[|][[:space:]]*oks[[:space:]]*[|][[:space:]]*total[[:space:]]*$/ { hdr = NR; next }
            hdr && NR == hdr + 2 {
              line = $0; gsub(/[[:space:]]/, "", line)
              if (split(line, c, "|") == 4 && c[1] ~ /^[0-9]+$/ && c[2] ~ /^[0-9]+$/ && c[3] ~ /^[0-9]+$/ && c[4] ~ /^[0-9]+$/)
                printf "fails=%s warns=%s oks=%s total=%s\n", c[1], c[2], c[3], c[4]
              exit
            }
          ' ./_audit-out/audit.log)
          echo "RLS audit summary: ${summary:-not reached (the audit stopped before step 13)}"
          echo "psql exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::RLS audit failed (psql exit ${rc}). Details are not printed in this public log."
          fi
          exit "$rc"

      - name: Failure summary
        if: failure()
        run: |
          echo "::error title=RLS Audit FAILED::Cross-tenant isolation regressed on staging, or the audit could not run. The per-table report is never published (this repository is public): on-call re-runs tests/rls-audit/audit.sql against staging in the Supabase SQL editor for the per-table detail, and HALTS prod deploys until it's green again."

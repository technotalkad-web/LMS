# Nightly Supabase Postgres backup.
#
# Runs daily at 02:00 UTC (07:30 IST). Dumps the production database
# with pg_dump, gzips it, GPG-encrypts it to BACKUP_GPG_PUBKEY, and uploads
# the encrypted file to a PRIVATE Backblaze B2 bucket (daily/<file> plus a
# latest/ pointer). Encryption is mandatory: with no usable key the job
# fails before the upload step, so a plaintext dump never leaves the runner.
# Nothing is published as a GitHub artifact: this repository is public, and
# its artifacts can be downloaded by any signed-in GitHub user.
#
# The dump bucket must stay private. Never make it public, never serve it
# from a public URL, and never monitor it through one (latest/ is a fixed,
# guessable key). Watch freshness through GitHub's failure email for this
# workflow, or an authenticated `aws s3 ls` of daily/
# (docs/ops/backup-restore.md).
#
# Restoring needs the PRIVATE GPG key that matches BACKUP_GPG_PUBKEY:
# without it every dump is permanently unreadable.
#
# The run log is public: it shows only the file name and size. pg_dump and
# gpg errors go to files on the runner (libpq can echo parts of the
# connection string), and the job prints a fixed ::error:: line instead.
#
# Required GitHub Secrets:
#   PROD_DATABASE_URL          Supabase connection string, URL-encoded password.
#                              Use the SESSION POOLER URI (Project Settings →
#                              Database → Connect → Session pooler, port 5432):
#                              GitHub runners are IPv4-only and direct connection
#                              is IPv6-only on newer projects, so direct fails;
#                              the transaction pooler (6543) can't run pg_dump.
#                              Example: postgresql://postgres.<ref>:[pass]@aws-1-<region>.pooler.supabase.com:5432/postgres
#   B2_BUCKET                  Backblaze B2 bucket name, e.g. "lms-backups"
#                              (a private bucket)
#   B2_REGION                  Bucket region — visible on the B2 bucket page.
#                              Examples: "us-west-002", "eu-central-003"
#   B2_KEY_ID                  Application Key ID (B2 dashboard →
#                              App Keys → Add a New Application Key,
#                              scoped to the bucket above with
#                              "Read and Write" capabilities)
#   B2_APPLICATION_KEY         Application Key (shown ONCE on creation —
#                              save it before you navigate away)
#   BACKUP_GPG_PUBKEY          Armored public key (paste the full block
#                              including "-----BEGIN PGP PUBLIC KEY BLOCK-----").
#                              Generate with: gpg --gen-key, export with
#                              `gpg --armor --export <fingerprint>`. The job
#                              encrypts to the key's primary fingerprint.
#                              Store the matching PRIVATE key somewhere safe
#                              (1Password, hardware key, secure offline storage).
#
# Why Backblaze B2:
#   - Truly free 10GB tier + 1GB/day egress, no credit card required
#   - S3-compatible API (same `aws s3 cp` invocation works)
#   - In production since 2015, widely used for backups
name: Nightly Supabase backup

on:
  schedule:
    # 02:00 UTC daily = 07:30 IST
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-backup
  cancel-in-progress: false

# No checkout and no GitHub API calls: read-only token.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Postgres client + tooling
        run: |
          # Ubuntu 24.04 ships pg_dump 16 by default; pin to 17 for
          # forward compat with newer Supabase Postgres versions.
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg unzip
          # Postgres APT repo for pg_dump 17
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor -o /etc/apt/keyrings/postgres.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgres.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/postgres.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # The runner image ships pg_dump 16 at /usr/bin, which wins on PATH
          # and refuses to dump a newer server ("server version mismatch":
          # prod is Postgres 17.x). Put the v17 client dir first — for THIS
          # step (export) and all later steps (GITHUB_PATH).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version   # must print 17.x
          # AWS CLI v2 via official installer.
          # Ubuntu 24.04 (noble) removed the `awscli` apt package because
          # the v1 series was deprecated. AWS now ships only v2 via this
          # zip installer — see https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2-linux.html.
          # We install to a temp prefix so subsequent steps find it on PATH.
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Dump database
        env:
          PGCONNECT_TIMEOUT: "30"
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          OUT="lms-prod-${STAMP}.sql"
          echo "Dumping to ${OUT}..."
          # --no-owner / --no-privileges keeps the dump portable across
          # Supabase projects (different role names). --clean + --if-exists
          # lets restore against an existing DB without manual DROPs.
          # stderr goes to a file, never the public log: on a failed
          # connection libpq prints the pooler host and user, and for a
          # malformed URL it can echo a fragment of the password.
          if ! pg_dump \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            --file="${OUT}" \
            "${DATABASE_URL}" 2>"$RUNNER_TEMP/pg_dump.err"; then
            echo "::error title=backup failed::pg_dump failed. Its error output is not printed in this public log; run pg_dump against the same URL privately to see it."
            exit 1
          fi
          ls -lh "${OUT}"
          # Compress
          gzip -9 "${OUT}"
          ls -lh "${OUT}.gz"
          # Record metadata for next step
          echo "BACKUP_FILE=${OUT}.gz" >> $GITHUB_ENV
          echo "BACKUP_STAMP=${STAMP}" >> $GITHUB_ENV

      - name: Encrypt with GPG (required)
        env:
          GPG_PUBKEY: ${{ secrets.BACKUP_GPG_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PUBKEY}" ]; then
            echo "::error title=backup not encrypted::The BACKUP_GPG_PUBKEY secret is not set. A plaintext dump is never uploaded, so nothing was uploaded. Set the secret (see the header of .github/workflows/backup.yml) and re-run."
            exit 1
          fi
          echo "Encrypting with the BACKUP_GPG_PUBKEY public key..."
          # Quiet import: gpg would print the key's user id (name and email),
          # which is not in the armored secret, so GitHub would not mask it.
          if ! printf '%s\n' "${GPG_PUBKEY}" | gpg --batch --quiet --import 2>/dev/null; then
            echo "::error title=backup not encrypted::BACKUP_GPG_PUBKEY could not be imported. Nothing was uploaded."
            exit 1
          fi
          # Encrypt to the primary key's fingerprint (the first fpr record),
          # never to a user id parsed from the key.
          FINGERPRINT=$(printf '%s\n' "${GPG_PUBKEY}" | gpg --batch --show-keys --with-colons 2>/dev/null \
            | awk -F: '$1 == "fpr" && !seen { print $10; seen = 1 }' || true)
          if ! [[ "${FINGERPRINT}" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]; then
            echo "::error title=backup not encrypted::No fingerprint could be read from BACKUP_GPG_PUBKEY. Nothing was uploaded."
            exit 1
          fi
          if ! gpg --batch --quiet --trust-model always --encrypt --armor \
            --recipient "${FINGERPRINT}" \
            --output "${BACKUP_FILE}.asc" \
            "${BACKUP_FILE}" 2>"$RUNNER_TEMP/gpg.err"; then
            echo "::error title=backup not encrypted::gpg could not encrypt to BACKUP_GPG_PUBKEY (expired or unusable key?). Nothing was uploaded."
            exit 1
          fi
          rm "${BACKUP_FILE}"
          echo "BACKUP_FILE=${BACKUP_FILE}.asc" >> $GITHUB_ENV
          ls -lh "${BACKUP_FILE}.asc"

      - name: Upload to Backblaze B2
        env:
          # B2 is S3-compatible, so the standard AWS SDK env vars work.
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"
          KEY="daily/${BACKUP_FILE}"
          echo "Uploading ${BACKUP_FILE} to b2://${B2_BUCKET}/${KEY}..."
          aws s3 cp "${BACKUP_FILE}" "s3://${B2_BUCKET}/${KEY}" \
            --endpoint-url "${ENDPOINT}"
          # Also keep a "latest.sql.gz[.asc]" pointer for easy fetch:
          # we copy the same file to a stable key so restore tooling
          # always has a fixed URL regardless of date.
          LATEST_KEY="latest/$(basename "${BACKUP_FILE}" | sed -E 's/lms-prod-[^.]+\./lms-prod./')"
          echo "Also writing pointer to b2://${B2_BUCKET}/${LATEST_KEY}..."
          aws s3 cp "${BACKUP_FILE}" "s3://${B2_BUCKET}/${LATEST_KEY}" \
            --endpoint-url "${ENDPOINT}"
          echo "B2 upload complete."

      - name: Summary
        run: |
          {
            echo "## Backup complete ✅"
            echo ""
            echo "- **Object:** \`daily/${BACKUP_FILE}\`"
            echo "- **Size:** $(ls -lh "${BACKUP_FILE}" | awk '{print $5}')"
            echo ""
            echo "Restore instructions: docs/ops/backup-restore.md"
          } >> $GITHUB_STEP_SUMMARY

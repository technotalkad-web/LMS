name: Scheduled crons (prod)

# WHY THIS EXISTS
# OpenNext (@opennextjs/cloudflare) builds a Worker that exports only `fetch` —
# it does NOT synthesize a `scheduled` handler, so Cloudflare cron triggers in
# wrangler.toml fire events nothing receives. Result: every /api/cron/* job was
# silently dead in production (reminders, billing, reaper, report-view refresh,
# rls-audit). This workflow drives them externally by POSTing each endpoint with
# the shared CRON_SECRET, on the same schedule the wrangler.toml documented.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   PROD_CRON_SECRET  — must equal the prod Worker's CRON_SECRET
#   PROD_BASE_URL     — e.g. https://my-lms-prod.mentora.workers.dev
#
# NOTE: GitHub-hosted cron can be delayed/coalesced under load and only runs on
# the default branch. Fine for hourly/daily ops jobs. If you need precise timing,
# replace this with a dedicated tiny Cloudflare Worker that has a scheduled()
# handler and fetches these same endpoints.

on:
  schedule:
    - cron: "0 2 * * *"    # /api/cron/billing                — daily 02:00 UTC
    - cron: "0 3 * * *"    # /api/cron/reaper                 — daily 03:00 UTC
    - cron: "30 3 * * *"   # /api/cron/refresh-report-views   — daily 03:30 UTC
    - cron: "0 6 * * *"    # /api/cron/reminders              — daily 06:00 UTC
    - cron: "0 7 * * 1"    # /api/cron/rls-audit              — Mondays 07:00 UTC
    - cron: "*/5 * * * *"  # /api/cron/lrs-forward            — every 5 min (outbox retry net)
    - cron: "7-59/15 * * * *" # /api/cron/gamification-refresh — every 15 min (leaderboard matviews; offset to dodge :00 pileups)
    - cron: "30 0 1 * *"   # /api/cron/gamification-monthly   — 1st of month 00:30 UTC (= 06:00 IST close)
    - cron: "0 * * * *"    # /api/cron/journey-nudges         — hourly; each journey emails at its admin-set reminder hour (org-local), once/day
    # report-card-refresh (3-59/15) is off until v1.3.0 is verified on production: the route is not deployed there yet,
    # so every run was a 404 (ADR 0007 step 7). docs/release/v1.3.0.md §6.2 puts the schedule line and its case arm back.
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Cron endpoint path to invoke (manual run)"
        required: true
        default: "/api/cron/reminders"

# The job only POSTs with curl: it never checks out or calls the GitHub API.
permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Map schedule → endpoint and POST it
        env:
          CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
          BASE: ${{ secrets.PROD_BASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.endpoint }}
        run: |
          set -euo pipefail
          if [ -n "${SCHEDULE}" ]; then
            case "${SCHEDULE}" in
              "0 2 * * *")  P=/api/cron/billing ;;
              "0 3 * * *")  P=/api/cron/reaper ;;
              "30 3 * * *") P=/api/cron/refresh-report-views ;;
              "0 6 * * *")  P=/api/cron/reminders ;;
              "0 7 * * 1")  P=/api/cron/rls-audit ;;
              "*/5 * * * *") P=/api/cron/lrs-forward ;;
              "7-59/15 * * * *") P=/api/cron/gamification-refresh ;;
              "30 0 1 * *") P=/api/cron/gamification-monthly ;;
              "0 * * * *")  P=/api/cron/journey-nudges ;;
              *) echo "Unknown schedule '${SCHEDULE}'"; exit 1 ;;
            esac
          else
            P="${MANUAL}"
          fi
          # A manual endpoint is appended to BASE: only a plain cron path may
          # reach curl (no host, port, query or traversal), so the secret
          # header can only ever go to the prod Worker.
          [[ "$P" =~ ^/api/cron/[a-z0-9-]+$ ]] || { echo "::error::invalid endpoint"; exit 1; }
          echo "POST ${BASE}${P}"
          code=$(curl -sS --proto =https --max-redirs 0 -o /tmp/body -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" "${BASE}${P}")
          echo "HTTP ${code}"
          # This log is public: print only the top-level numbers and booleans
          # of the response (counters, ok). Strings, arrays and objects (tenant
          # slugs, org ids, table names, error text) and any non-JSON body
          # (an HTML error page) are never printed; the routes keep their
          # detail in their heartbeat and audit rows.
          jq -c 'with_entries(select(.value|type=="number" or type=="boolean"))' /tmp/body 2>/dev/null || echo '(non-JSON body suppressed)'
          if [ "${code}" != "200" ]; then
            echo "::error::Cron ${P} returned ${code}"
            exit 1
          fi

# Lifecycle nightly (ADR 0007 step 15): the ALDS lifecycle subset of
# tests/bot/lifecycle, every night, against the staging database.
#
# Subset: 00, 32, 33, 34, 43, 47, 48, 49, 50-53 (ADR 0007 step 15), 54
# (ADR 0008 step 17), 55 (ADR 0009 step 12), 63 (ADR 0019 decision 7),
# 64 (ADR 0020 step 10), 65 (ADR 0021 F.5) and 66 (ADR 0022 item 18), each
# added after a green run on staging. The golden canary of ADR 0005 step 12
# joins when it exists (P4).
#
# Two jobs, one after the other (ADR 0024 step 73: split before new specs
# join, never side by side on the one staging database): `lifecycle` runs
# that subset (DEFAULT_SPECS); `lifecycle-products` then runs PRODUCT_SPECS,
# the ADR 0024 specs (68 onward) as each joins, and runs even when the first
# job failed (!cancelled()). With PRODUCT_SPECS empty, or a dispatch that
# names specs (they run in the first job), the second job's selection step
# says so and the job passes without installing or building. A green night
# is both jobs green. Timing: GitHub starts the 22:41 schedule late (runs
# created between about 00:30 and 04:20 UTC in Oct-Nov 2026), and the split
# makes a run up to 150 minutes long, so no clock window is clear of it:
# before a staging paste or a hand-run harness, check that no run is in
# progress (`gh run list --workflow lifecycle-nightly.yml --status
# in_progress`). Unverified in this repository: whether a first job that
# times out (rather than fails) still lets the second run; if it does not,
# that red night only loses the product specs.
#
# Target: this commit, built and started INSIDE the runner on
# http://localhost:3100, against the STAGING Supabase project, with the same
# three STAGING_* secrets the pr-checks e2e job uses. No new secret, no
# deployed staging URL: the run tests the code on the default branch rather
# than whatever a staging deploy last pushed, it is not subject to the
# Workers free-plan CPU cap, and spec 51's loopback webhook listener and its
# server-log case work. (ADR 0007 decision 2, note of 2026-10-18, records
# this in-runner target in place of the Workers staging with retries.)
#
# Data: the lifecycle namespace (lifecycle-* orgs, @lifecycle.test users),
# which the e2e purge of pr-checks and nightly-e2e never matches, so a push
# during this run no longer wipes it. The lifecycle global setup deletes
# lifecycle data older than 48 h (tests/bot/lifecycle/cleanup.ts) and
# refuses any Supabase project but staging.
#
# Public-log rule: the build log, server log, Playwright output and JSON
# report stay in $RUNNER_TEMP; nothing is uploaded. The job prints counts
# per spec file and, for each failing test, its title path, the
# file:line:column of its first error and how long it ran; never an error
# message, test output or attachment (scripts/lifecycle-summary.mjs;
# ADR 0007 decision 2, notes of 2026-10-19 and 2026-11-14). Reproduce a failure locally: bash scripts/lifecycle-nightly.sh
# (header there).
name: Lifecycle nightly (staging)

on:
  schedule:
    # 22:41 UTC = 04:11 IST. Clear of the 01:30-04:45 UTC block (ops digest,
    # backup, ops-review, content-backup, crons, nightly-e2e 04:00) and of
    # the busy minutes (*/5, */10, 3-59/15, 7-59/15).
    - cron: "41 22 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description: "Spec numbers to run, space-separated (blank = the nightly subset)"
        required: false
        default: ""

concurrency:
  group: lifecycle-nightly
  cancel-in-progress: false

# Read-only token: the job checks out, builds and runs Playwright.
permissions:
  contents: read

jobs:
  lifecycle:
    name: Lifecycle nightly (staging)
    # ubuntu-24.04, not ubuntu-latest (now 26.04): Playwright 1.60 cannot install chromium on 26.04.
    runs-on: ubuntu-24.04
    # Build about 5 min; the subset about 40-80 min serially (workers: 1;
    # ADR 0024 step 73 plans for the longer figure).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The staging secrets reach this step only.
      - name: Build, start and run the lifecycle subset (counts, failing-test locations and durations)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
          LIFECYCLE_PORT: "3100"
          LIFECYCLE_SPECS: ${{ inputs.specs }}
        run: bash scripts/lifecycle-nightly.sh

  lifecycle-products:
    name: Lifecycle nightly, products (staging)
    # After the first job, never beside it; also after a red or timed-out first job.
    needs: lifecycle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No secrets: it only reads the lists in scripts/lifecycle-nightly.sh.
      - name: Select the product list
        id: plan
        env:
          LIFECYCLE_LIST: products
          LIFECYCLE_PLAN_ONLY: "1"
          LIFECYCLE_SPECS: ${{ inputs.specs }}
        run: bash scripts/lifecycle-nightly.sh
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
      - if: steps.plan.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright browsers
        if: steps.plan.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      # The staging secrets reach this step only.
      - name: Build, start and run the product specs (counts, failing-test locations and durations)
        if: steps.plan.outputs.run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
          LIFECYCLE_PORT: "3100"
          LIFECYCLE_LIST: products
          LIFECYCLE_SPECS: ${{ inputs.specs }}
        run: bash scripts/lifecycle-nightly.sh

# PR checks — runs on every push to any branch and every PR.
# Four parallel jobs: typecheck, lint, unit, e2e.
# Failure on any blocks PR merge (when branch protection is enabled).
name: PR checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same ref when a newer commit lands.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job pushes, comments or uploads.
permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # tests/bot (lifecycle and bot specs) is outside the app tsconfig.
      - run: npm run typecheck:bot

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Migration grants (Supabase 2026-10-30 rule)
        run: node scripts/check-migration-grants.mjs

  # Every tests/unit/*.test.ts file, each in its own tsx process, failing on
  # the first failure (ADR 0003 step 15, ADR 0007 step 14). No database, no
  # secrets: these are pure-logic tests.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # Build about 5 min, the suite about 5-10 min with CI retries.
    timeout-minutes: 30
    # Target (owner decision 2026-10-20, Option A): THIS commit, built and
    # started INSIDE the runner on http://localhost:3100 by
    # scripts/e2e-in-runner.sh, against the STAGING Supabase database (the
    # same three STAGING_* secrets as before; the script refuses any other
    # project). It no longer targets the deployed Workers staging site, whose
    # free-plan CPU limit failed requests at random with error 1102 (2 tests
    # red and 5 flaky on 2026-10-20), and which ran whatever staging last
    # deployed rather than the PR's code. The app runs with the staging
    # Worker's configuration (ALDS_P4=on); the production configuration (flag
    # absent) stays covered by lifecycle-nightly.yml. The build and server
    # logs stay in $RUNNER_TEMP; nothing is uploaded. The job's exit code is
    # Playwright's (retries 2, workers 2, forbidOnly under CI, as before).
    # nightly-e2e.yml still targets the deployed Workers staging.
    #
    # Skip on pushes to main: the pull_request run already tested the merge
    # result (refs/pull/N/merge), and a run on the merge push would add about
    # 15 min plus one more concurrent qa-* purge of the shared staging data.
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The staging secrets reach this step only.
      - name: Build, start and run Playwright against the app in the runner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
          E2E_PORT: "3100"
        run: bash scripts/e2e-in-runner.sh

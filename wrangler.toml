# =============================================================================
# Cloudflare Workers config for the LMS
# =============================================================================
#
# Built by OpenNext from the Next.js app. The Worker entry, assets, and
# routes wire-up are produced by `opennextjs-cloudflare build`; this file
# tells wrangler where to find them and what runtime flags to apply.
#
# Two surfaces this file controls beyond the build artifact:
#   1. compatibility_flags = ["nodejs_compat"] — required for
#      crypto.createHmac (impersonation cookie) and @aws-sdk/* (R2).
#   2. [triggers.crons] — kept EMPTY on purpose. The Worker OpenNext builds
#      exports only `fetch`, so a Cloudflare cron trigger would fire an event
#      nothing receives. Every scheduled job is a GitHub Actions run of
#      .github/workflows/cron.yml that POSTs /api/cron/* on production
#      (ops/RUNBOOK.md §2; staging has no schedule).
#
# Secrets (SUPABASE_SERVICE_ROLE_KEY, IMPERSONATION_SECRET, CRON_SECRET,
# R2 keys) are set with `wrangler secret put <NAME>` — never in this file.
# Public/non-secret env vars (NEXT_PUBLIC_*, NEXT_PUBLIC_SITE_URL,
# STORAGE_DRIVER, etc.) go in the [vars] block below.
# =============================================================================

name = "my-lms"
main = ".open-next/worker.js"

# `compatibility_date` should be set to today or recent past at first deploy,
# then ratcheted forward only when you've tested a newer date locally.
# 2025-03-01 is a known-good baseline for OpenNext + Next.js 16.
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by Next/OpenNext.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Observability — surface Worker logs in the Cloudflare dashboard.
[observability]
enabled = true

# ---- Scheduled triggers (cron) ---------------------------------------------
# Empty, and it stays empty: OpenNext synthesizes no `scheduled` handler, so
# Cloudflare would invoke nothing at these times. The schedules live in
# .github/workflows/cron.yml, which POSTs each /api/cron/* route of the
# production Worker with its cron secret. Each such call is one ordinary
# request, under the free plan's limits like any other.
[triggers]
crons = [
  
]

# ---- Non-secret env vars ---------------------------------------------------
# IMPORTANT: NEXT_PUBLIC_* values are public anyway; service-role keys
# and HMAC secrets must NEVER go here — use `wrangler secret put` instead.
#
# Fill these in with your real prod values before first deploy.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://zeaclbapadosqqttexxh.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_2ynjJ05_qfegVFb495AR5g_mTezusls"
NEXT_PUBLIC_SITE_URL = "https://my-lms.mentora.workers.dev"
NEXT_PUBLIC_SENTRY_DSN = "https://8f6c96bf3bfdfe59bce26a500b9a5396@o4511468212846592.ingest.de.sentry.io/4511468217892944"
NEXT_PUBLIC_SENTRY_ENV = "staging"
STORAGE_DRIVER = "supabase"
SUPABASE_STORAGE_BUCKET = "course-content"
NODE_ENV = "production"
# ALDS P4 (ADR 0005 note (h), ADR 0006 note (a)): the Package Guardian gate,
# the tier surfaces and the cmi5 launch contract. This line is the STAGING
# Worker's: this top-level block is what `wrangler deploy` with no --env uses
# (deploy-staging.yml). `vars` is NOT inherited by [env.production] (wrangler:
# "This field is not automatically inherited from the top level environment");
# production reads only [env.production.vars], which carries its own ALDS_P4
# line from v1.4.0 (see there, and docs/release/v1.4.0.md). Switched on here
# only after 0100_alds_core.sql was confirmed on the staging database.
ALDS_P4 = "on"

# ---- Platform sender (ADR 0029; lib/email/platform-sender.ts) ---------------
# The platform's own mailbox, for platform mail only: platform owners' and
# organisation administrators' codes and links, administrator welcomes and
# SMTP alerts. Never a learner's mail and never a fallback for a tenant's SMTP.
# Every value is a SECRET, the non-secret ones too, so no address sits in this
# public repository. This (staging) Worker:
#   wrangler secret put PLATFORM_SMTP_HOST
#   wrangler secret put PLATFORM_SMTP_PORT              # 465 for Gmail
#   wrangler secret put PLATFORM_SMTP_SECURE            # true with 465
#   wrangler secret put PLATFORM_SMTP_USER
#   wrangler secret put PLATFORM_SMTP_PASSWORD          # the mailbox's app password
#   wrangler secret put PLATFORM_SMTP_FROM              # Name <address>
#   wrangler secret put PLATFORM_EMAIL_ALLOW_DOMAINS    # staging: exact addresses only
#     The value is a list cut at commas: on staging only exact addresses,
#       <local>@<domain>,<local>+<fixed-alias>@<domain>,...
#     each allowing that address alone ("+tag" and dot variants are other
#     addresses); no domain entry and no "*". The four entries and their uses
#     are in ops/RUNBOOK.md §6.3a, "The allow-list". The real addresses go
#     only into this secret, never into a file. Reserved test domains are
#     never mailed anyway. A list with no usable entry sends nothing.
# Optional: PLATFORM_EMAIL_REPLY_TO, PLATFORM_EMAIL_DAILY_CEILING (default 375;
# 25 where staging shares production's mailbox; otherwise three quarters of
# the mailbox's daily cap) and
# PLATFORM_EMAIL_ORG_DAILY_LIMIT (default 50). Staging never uses production's
# credential. Unset, the sender sends nothing and /api/ops/health reads
# degraded to a caller with the secret. Setup, rotation, limits: ops/RUNBOOK.md §6.3.

# ---- White-label custom domains (tenant own-domain routing) -----------------
# The code is host-agnostic; this feature stays fully inert until enabled.
# When you move to proper infra, see docs/INFRA_MIGRATION.md. Then set:
#   PRIMARY_APP_HOST        = "app.your-platform.com"  # never treated as a tenant domain
#   CUSTOM_DOMAINS_ENABLED  = "1"                       # flip on once CF for SaaS is ready
#   CF_SAAS_CNAME_TARGET    = "saas.your-platform.com"  # fallback-origin host tenants CNAME to
# CF_API_TOKEN and CF_ZONE_ID are SECRETS — set via `wrangler secret put`, not here.
# PRIMARY_APP_HOST = "app.your-platform.com"
# CUSTOM_DOMAINS_ENABLED = "1"
# CF_SAAS_CNAME_TARGET = "saas.your-platform.com"

# ---- Platform domain (the app's own host) ----------------------------------
# Uncomment + edit after the Worker is deployed once and you've added the
# domain in Cloudflare DNS. The pattern matches the host you'll serve on.
# Also update NEXT_PUBLIC_SITE_URL above to match, then rebuild + redeploy.
# [[routes]]
# pattern = "app.your-platform.com"
# custom_domain = true

# ---- R2 binding (only if STORAGE_DRIVER=r2) --------------------------------
# Uncomment + create the bucket via `wrangler r2 bucket create lms-uploads`
# if you switch from Supabase Storage to R2.
# [[r2_buckets]]
# binding = "R2_UPLOADS"
# bucket_name = "lms-uploads"

# =============================================================================
# Production environment
# =============================================================================
# Deployed with:  npx wrangler deploy --env production
# Runs as a separate Worker named "my-lms-prod" at:
#   https://my-lms-prod.mentora.workers.dev
#
# IMPORTANT: with [env.*], vars / triggers / r2_buckets / kv_namespaces do
# NOT inherit from the top-level config — they must be redeclared here for
# the production env. Inheritable: name/main/compatibility_date/flags.
#
# Secrets (SUPABASE_SERVICE_ROLE_KEY, IMPERSONATION_SECRET, CRON_SECRET)
# are set with `wrangler secret put <NAME> --env production` — never here.
# =============================================================================
[env.production]
name = "my-lms-prod"

[env.production.assets]
directory = ".open-next/assets"
binding = "ASSETS"

[env.production.observability]
enabled = true

[env.production.triggers]
# IMPORTANT: OpenNext (@opennextjs/cloudflare) builds a Worker that exports only
# `fetch` — it does NOT synthesize a `scheduled` handler. Cloudflare cron
# triggers here would fire events the Worker can't receive, so the /api/cron/*
# jobs never run. The schedules now live in .github/workflows/cron.yml, which
# POSTs each endpoint with CRON_SECRET. Keep this empty to avoid unhandled
# scheduled invocations.
crons = []

[env.production.vars]
NEXT_PUBLIC_SUPABASE_URL = "https://alkfrcglmseksweqhwzq.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_qDQKIyEyoj8zTg6jZ0jCkA_O24oAtQh"
NEXT_PUBLIC_SITE_URL = "https://my-lms-prod.mentora.workers.dev"
# TODO: create separate Sentry project "lms-prod" and swap this DSN.
# Until then we share the staging project; events are tagged "production"
# via NEXT_PUBLIC_SENTRY_ENV so you can filter in the Sentry UI.
NEXT_PUBLIC_SENTRY_DSN = "https://8f6c96bf3bfdfe59bce26a500b9a5396@o4511468212846592.ingest.de.sentry.io/4511468217892944"
NEXT_PUBLIC_SENTRY_ENV = "production"
STORAGE_DRIVER = "supabase"
SUPABASE_STORAGE_BUCKET = "course-content"
NODE_ENV = "production"
# Arms cron-staleness paging in /api/ops/health. Prod-only: cron.yml drives
# crons on prod alone — never set this on staging, where heartbeats are stale
# by design and the env would read permanently degraded.
OPS_EXPECT_CRONS = "1"
# ALDS P4 on production from v1.4.0 (ADR 0005 note (h); docs/release/v1.4.0.md).
# The sitting's order: 0103 and 0104 are pasted while v1.3.0 still runs, then
# the v1.4.0 tag deploys this line, then 0100_alds_core.sql is pasted. The flag
# goes BEFORE 0100 because that pairing is fail-soft: with 0100 absent, every
# P4 read or write of a 0100 object skips (lib/alds/flag.ts,
# isAldsSchemaMissing); the parts of the cmi5 launch contract that need no
# 0100 object (the LMS-issued AU id, the LMS.LaunchData document) run as on
# staging. The reverse pairing is not: with 0100 present and the
# flag absent, a staff launch is stored with is_preview false, 0100's delete
# guards count it as learner history, and an admin's course delete answers 409
# (spec 50, observed on staging with the flag absent). Removing this line while
# 0100 is on the production database brings that pairing back. With the line
# here, wrangler's warning that ALDS_P4 exists at the top level but not in
# env.production.vars no longer appears on production deploys.
ALDS_P4 = "on"
# Platform sender (ADR 0029; see the top-level block): every PLATFORM_SMTP_* and
# PLATFORM_EMAIL_* value is a SECRET, set with
# `wrangler secret put <NAME> --env production`, never here. Production's
# PLATFORM_EMAIL_ALLOW_DOMAINS is "*". Set them before the tag that carries the
# sender: a release without them reads degraded at once (ADR 0029 section M).
# White-label custom domains (see docs/INFRA_MIGRATION.md). Inert until set.
# PRIMARY_APP_HOST = "app.your-platform.com"
# CUSTOM_DOMAINS_ENABLED = "1"
# CF_SAAS_CNAME_TARGET = "saas.your-platform.com"
# [[env.production.routes]]  (declare the platform domain here for prod)
# pattern = "app.your-platform.com"
# custom_domain = true

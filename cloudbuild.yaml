# Cloud Build: build the LMS container and push it to Artifact Registry.
# Usage (see docs/CLOUD_RUN_STAGING.md):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SUPABASE_URL=…,_SUPABASE_ANON_KEY=…,_SITE_URL=…
# NEXT_PUBLIC_* values are build args because Next inlines them at build time.
# Nothing secret goes here — service-role key, cron secret etc. are runtime
# env vars / Secret Manager references on the Cloud Run service.
substitutions:
  _REGION: asia-south1
  _REPO: lms
  _IMAGE: my-lms-staging
  # SHORT_SHA is only set for trigger builds; local `builds submit` passes
  # the git commit via _TAG (scripts/cloud-run-deploy.sh does this).
  _TAG: manual
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
  _SITE_URL: ""
  _SENTRY_DSN: ""
  _SENTRY_ENV: "staging-gcp"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_SENTRY_DSN=${_SENTRY_DSN}
      - --build-arg=NEXT_PUBLIC_SENTRY_ENV=${_SENTRY_ENV}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
